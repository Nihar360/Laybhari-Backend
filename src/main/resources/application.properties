spring.application.name=laybhari-backend
server.port=${PORT:8080}

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:${MYSQL_DATABASE:laybhari_db}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}
spring.datasource.username=${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}}
spring.datasource.password=${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQL_ROOT_PASSWORD:${DB_PASSWORD:nihar@360}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = auto-create/alter tables from entities. Switch to 'validate' once schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Generate a real 256-bit secret before going to production. Never commit this to git.
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS
app.jwt.expiration-ms=86400000
